  <script>
    (function () {
      // DDoS-Guard после своего challenge делает location.reload(), а браузер
      // восстанавливает scrollY из history. Это ломает vaul (body.top = -scrollY).
      // Плюс иногда DDoS-Guard оставляет inline-стили на <html>/<body>.
      // Сбрасываем всё до того как vaul/React смонтируется.
      try { window.scrollTo(0, 0); } catch (e) {}

      // Чистим возможные inline-style артефакты от DDoS-Guard
      document.documentElement.removeAttribute('style');
      if (document.body) document.body.removeAttribute('style');

      // Детектируем факт прохождения challenge по куке и форсим relayout
      // уже после монтирования приложения.
      var hadDDoSGuard = /(^|;\s*)__ddg\d*_?=/.test(document.cookie || '');
      if (hadDDoSGuard) {
        window.__hadDDoSGuard = true;
        var fixLayout = function () {
          try { window.scrollTo(0, 0); } catch (e) {}
          window.dispatchEvent(new Event('resize'));
          if (window.visualViewport) {
            window.visualViewport.dispatchEvent(new Event('resize'));
          }
        };
        window.addEventListener('load', function () {
          fixLayout();
          requestAnimationFrame(fixLayout);
          setTimeout(fixLayout, 300);
        });
      }
    })();
  </script>
