  <script>
    function resetStylesAfterDDoSGuard() {
      // Сбрасываем стили, которые могли остаться от DDoS-Guard
      document.documentElement.style.height = '100%';
      document.documentElement.style.width = '100%';
      document.documentElement.style.overflow = 'hidden';
      document.body.style.height = '100%';
      document.body.style.width = '100%';
      document.body.style.overflow = 'hidden';
      document.body.style.position = 'fixed';
      document.body.style.top = '0';
      document.body.style.left = '0';
      document.body.style.right = '0';
      document.body.style.bottom = '0';

      const root = document.getElementById('root');
      if (root) {
        root.style.height = '100%';
        root.style.width = '100%';
        root.style.overflow = 'auto';
        root.style.position = 'relative';
      }
    }

    function ensureDocumentIsScrollable() {
      const isScrollable =
        document.documentElement.scrollHeight > window.innerHeight;
      if (!isScrollable) {
        document.documentElement.style.setProperty(
          "height",
          "calc(100vh + 1000px)",
          "important"
        );
      }
    }

    function preventCollapse() {
      if (window.scrollY === 0) {
        window.scrollTo(0, 1);
      }
    }

    // Сбрасываем стили сразу и после загрузки
    resetStylesAfterDDoSGuard();

    const scrollableElement = document.querySelector(".scrollable-element");
    if (scrollableElement) {
      scrollableElement.addEventListener("touchstart", preventCollapse);
    }

    window.addEventListener("load", () => {
      resetStylesAfterDDoSGuard();
      ensureDocumentIsScrollable();
    });

    // Также сбрасываем после DOMContentLoaded на случай, если DDoS-Guard загружается позже
    document.addEventListener("DOMContentLoaded", resetStylesAfterDDoSGuard);
  </script>
